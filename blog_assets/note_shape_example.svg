<svg xmlns="http://www.w3.org/2000/svg" width="520" height="220" viewBox="0 0 520 220" font-family="'Segoe UI', Arial, sans-serif">

  <!-- Background -->
  <rect width="520" height="220" fill="#1a1a1a" rx="12"/>

  <!-- Label: note -->
  <text x="110" y="28" text-anchor="middle" font-size="12" fill="#888" letter-spacing="1">note shape</text>

  <!-- Label: geo -->
  <text x="390" y="28" text-anchor="middle" font-size="12" fill="#888" letter-spacing="1">geo shape</text>

  <!-- ── note shape (yellow, light theme) ── -->
  <!-- shadow -->
  <rect x="38" y="47" width="144" height="124" rx="8" fill="#00000033"/>
  <!-- body -->
  <rect x="34" y="42" width="144" height="124" rx="8" fill="#f5d647"/>
  <!-- fold corner -->
  <polygon points="154,42 178,42 178,66" fill="#c9a900" opacity="0.4"/>
  <polygon points="154,42 178,66 154,66" fill="#e6c200" opacity="0.6"/>
  <!-- text -->
  <text x="106" y="108" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1a1a1a" font-weight="500">My idea</text>

  <!-- ── divider ── -->
  <line x1="260" y1="40" x2="260" y2="180" stroke="#333" stroke-width="1"/>

  <!-- ── geo shape (diamond, orange, dark theme) ── -->
  <!-- shadow -->
  <polygon points="393,50 476,114 393,178 310,114" fill="#00000044"/>
  <!-- body -->
  <polygon points="390,46 474,110 390,174 306,110" fill="#7c3905"/>
  <!-- text -->
  <text x="390" y="113" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#f2f2f2" font-weight="500">Decision</text>

</svg>
